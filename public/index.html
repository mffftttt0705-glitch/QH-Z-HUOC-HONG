<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#a78bfa" />
  <meta name="description" content="小云 - 桌宠 AI" />
  <title>小云 · 桌宠 AI</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body class="bg-default">
  <div id="pet" class="pet" title="拖我移动 · 双击打开面板">
    <img id="pet-img" src="/xiaoyun-school.png" alt="小云" draggable="false" />
    <div id="bubble" class="bubble hidden"></div>
  </div>

  <div id="panel" class="panel hidden">
    <div class="panel-header">
      <span>☁️ 小云</span>
      <button id="close-panel" class="btn-icon">✕</button>
    </div>
    <div class="panel-tabs">
      <button class="tab active" data-tab="outfit">换装</button>
      <button class="tab" data-tab="bg">背景</button>
      <button class="tab" data-tab="chat">对话</button>
      <button class="tab" data-tab="settings">设置</button>
    </div>

    <div class="tab-content" id="tab-outfit">
      <div class="outfit-grid">
        <button class="outfit-btn active" data-outfit="school">
          <img src="/xiaoyun-school.png" alt="校服" />
          <span>校服</span>
        </button>
        <button class="outfit-btn" data-outfit="hoodie">
          <img src="/xiaoyun-hoodie.png" alt="卫衣" />
          <span>卫衣</span>
        </button>
        <button class="outfit-btn" data-outfit="kimono">
          <img src="/xiaoyun-kimono.png" alt="浴衣" />
          <span>浴衣</span>
        </button>
      </div>
    </div>

    <div class="tab-content hidden" id="tab-bg">
      <div class="bg-grid">
        <button class="bg-btn active" data-bg="default">默认</button>
        <button class="bg-btn" data-bg="sunset">黄昏</button>
        <button class="bg-btn" data-bg="night">夜空</button>
        <button class="bg-btn" data-bg="sakura">樱花</button>
        <button class="bg-btn" data-bg="room">房间</button>
        <button class="bg-btn" data-bg="pure">纯白</button>
      </div>
    </div>

    <div class="tab-content hidden" id="tab-chat">
      <div id="chat-log" class="chat-log"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="和我聊天吧\~" maxlength="500" />
        <button id="send-btn" class="btn-primary">发送</button>
      </div>
    </div>

    <div class="tab-content hidden" id="tab-settings">
      <label class="switch-row">
        <span>自主说话</span>
        <input type="checkbox" id="auto-act" checked />
      </label>
      <label class="switch-row">
        <span>隐藏底部输入框</span>
        <input type="checkbox" id="hide-quick" />
      </label>
      <button id="reset-pos" class="btn-secondary">重置位置</button>
      <p class="hint">对话失败时请检查 Pages 是否已绑定 Workers AI（变量名 AI）。立绘请放在 public 目录。</p>
    </div>
  </div>

  <div id="quick-chat" class="quick-chat">
    <input type="text" id="quick-input" placeholder="按 Enter 快速对话..." />
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
